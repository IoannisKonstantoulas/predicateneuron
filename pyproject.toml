[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "predicateneuron"
version = "0.1.2"
description = "Differentiable predicate neuron (intersection / union / symmetric difference) and predicate layers for Keras, TensorFlow and PyTorch"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache 2.0" }
dependencies = ["numpy"]

[project.optional-dependencies]
keras      = ["keras>=3.0"]
tensorflow = ["tensorflow>=2.16", "keras>=3.0"]
torch      = ["torch>=2.0"]
all        = ["keras>=3.0", "tensorflow>=2.16", "torch>=2.0"]
dev        = ["pytest"]

[project.urls]
Homepage = "https://github.com/IoannisKonstantoulas/predicateneuron"
Paper = "https://TODO"

[tool.hatch.build.targets.wheel]
packages = ["src/predicateneuron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
